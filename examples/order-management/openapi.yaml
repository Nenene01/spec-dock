openapi: 3.1.0
info:
  title: Order Management API
  version: 0.2.0
  description: 顧客の注文を参照・管理するためのサンプルAPI。
servers:
  - url: https://api.example.com/v1
    description: 本番API
security:
  - bearerAuth: []
paths:
  /orders:
    get:
      operationId: listOrders
      summary: 注文一覧を取得する
      parameters:
        - name: page
          in: query
          description: 1から始まるページ番号。
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: 1ページあたりの注文数。
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, paid, shipped, cancelled]
      responses:
        '200':
          description: ページングされた注文一覧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
    post:
      operationId: createOrder
      summary: 注文を作成する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '201':
          description: 作成された注文。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '422':
          description: 入力値エラー。
  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: 注文詳細を取得する
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 注文詳細。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '404':
          description: 注文が見つかりません。
  /orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      summary: 注文をキャンセルする
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: キャンセルされた注文。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '409':
          description: 注文をキャンセルできません。
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    OrderListResponse:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    OrderSummary:
      type: object
      required: [id, orderNo, status, totalAmount]
      properties:
        id:
          type: string
          format: uuid
        orderNo:
          type: string
          minLength: 1
          maxLength: 32
        status:
          type: string
          enum: [pending, paid, shipped, cancelled]
        totalAmount:
          type: integer
          minimum: 0
    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          required: [customer, items, createdAt]
          properties:
            customer:
              $ref: '#/components/schemas/CustomerSummary'
            items:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/OrderItem'
            createdAt:
              type: string
              format: date-time
    OrderItem:
      type: object
      required: [productId, productName, quantity, unitPrice]
      properties:
        productId:
          type: string
          format: uuid
        productName:
          type: string
          minLength: 1
          maxLength: 120
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        unitPrice:
          type: integer
          minimum: 0
    CustomerSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
    OrderCreateRequest:
      type: object
      required: [customerId, items]
      properties:
        customerId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/OrderItemInput'
    OrderItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 99
    CancelOrderRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 240
